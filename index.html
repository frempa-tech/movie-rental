<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basketball</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

html{
    scroll-behavior:smooth;
}

@media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}

body{
    background:#111;
    color:white;
}

/* Navigation */

nav{
    position:relative;
    z-index:1000;
}

.hamburger{
    background:#ff7b00;
    border:none;
    border-radius:12px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:6px;
    padding:14px 16px;
    box-shadow:0 4px 14px rgba(255,123,0,.35);
    transition:.2s;
    position:fixed;
    top:18px;
    right:20px;
    z-index:1004;
}

.hamburger:hover{
    box-shadow:0 6px 18px rgba(255,123,0,.5);
    transform:translateY(-1px);
}

.hamburger span{
    width:24px;
    height:3px;
    background:white;
    border-radius:2px;
    transition:.25s ease;
}

.hamburger.active{
    border-radius:12px;
}

.hamburger.active span:nth-child(1){
    transform:translateY(9px) rotate(45deg);
}

.hamburger.active span:nth-child(2){
    opacity:0;
}

.hamburger.active span:nth-child(3){
    transform:translateY(-9px) rotate(-45deg);
}

.nav-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
    z-index:1002;
}

.nav-overlay.open{
    opacity:1;
    pointer-events:auto;
}

.nav-links{
    display:flex;
    flex-direction:column;
    position:fixed;
    top:0;
    right:-320px;
    width:280px;
    height:100vh;
    background:#ff7b00;
    box-shadow:-8px 0 24px rgba(0,0,0,.4);
    padding-top:100px;
    transition:right .35s ease;
    z-index:1003;
}

.nav-links.open{
    right:0;
}

nav a{
    position:relative;
    color:white;
    text-decoration:none;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
    padding:20px 30px;
}

.nav-links a:hover{
    background:rgba(0,0,0,.15);
}

/* Pages */

.page{
    display:none;
    min-height:calc(100vh - 70px);
    padding:40px;
}

.page.active{
    display:block;
    animation:fadeIn .4s ease;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(8px);}
    to{opacity:1; transform:translateY(0);}
}

/* Home */

.hero{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    min-height:80vh;

    background:
    linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.75)),
    url("backround.jpg");

    background-size:cover;
    background-position:center;
    border-radius:15px;
    position:relative;
    overflow:hidden;
}

.hero-badge{
    background:rgba(255,123,0,.15);
    border:1px solid #ff7b00;
    color:#ff7b00;
    font-size:14px;
    font-weight:bold;
    letter-spacing:2px;
    padding:8px 20px;
    border-radius:30px;
    margin-bottom:25px;
    text-transform:uppercase;
    animation:pulseGlow 2.5s ease-in-out infinite;
}

@keyframes pulseGlow{
    0%,100%{box-shadow:0 0 0px rgba(255,123,0,.4);}
    50%{box-shadow:0 0 18px rgba(255,123,0,.6);}
}

.hero h1{
    font-size:76px;
    color:#ff7b00;
    font-weight:900;
    margin-bottom:18px;
    text-shadow:0 4px 20px rgba(0,0,0,.6);
    letter-spacing:-1px;
}

.hero p{
    font-size:26px;
    color:#ddd;
    max-width:600px;
    line-height:1.5;
}

.hero-buttons{
    display:flex;
    gap:22px;
    flex-wrap:wrap;
    justify-content:center;
    margin-top:45px;
}

.button{
    background:#ff7b00;
    color:white;
    padding:18px 42px;
    border-radius:10px;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
    box-shadow:0 4px 14px rgba(255,123,0,.25);
    border:2px solid #ff7b00;
}

.button:hover{
    background:white;
    color:black;
    transform:translateY(-3px);
    box-shadow:0 8px 20px rgba(255,123,0,.35);
}

.button.outline{
    background:transparent;
    color:#ff7b00;
}

.button.outline:hover{
    background:#ff7b00;
    color:white;
}

/* Games / Teams / Playoffs Background */

.games-page,
.teams-page,
.playoffs-page{
    min-height:75vh;
    background-size:cover;
    background-position:center;
    border-radius:15px;
    padding:40px;
}

.games-page,
.playoffs-page{
    background:
    linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.65)),
    url("courts.jpg");

    background-size:cover;
    background-position:center;
}

.teams-page{
    background:
    linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.65)),
    url("teams.jpg");

    background-size:cover;
    background-position:center;
}


/* Games */

.games-container,
.teams-container,
.playoffs-container{
    max-width:1000px;
    margin:auto;
}

.games-title,
.teams-title,
.playoffs-title{
    text-align:center;
    color:#ff7b00;
    font-size:48px;
    margin-bottom:35px;
    text-shadow:0 4px 20px rgba(0,0,0,.5);
}

.no-games,
.no-teams,
.no-playoffs{
    text-align:center;
    color:#aaa;
    font-style:italic;
    font-size:24px;
    margin-top:50px;
}

.game{
    background:#222;
    border-left:8px solid #ff7b00;
    border-radius:10px;
    padding:22px;
    margin-bottom:20px;
    transition:.2s;
}

.game:hover{
    transform:translateY(-3px);
    background:#2a2a2a;
    box-shadow:0 6px 18px rgba(0,0,0,.4);
}

.game h2{
    color:#ff7b00;
    margin-bottom:10px;
}

.game p{
    margin:7px 0;
    font-size:18px;
}

.watch{
    margin-top:15px;
}

.watch a{
    display:inline-block;
    background:#ff7b00;
    color:white;
    text-decoration:none;
    padding:10px 18px;
    border-radius:6px;
    font-weight:bold;
    transition:.2s;
}

.watch a:hover{
    background:white;
    color:black;
}

.not-uploaded{
    color:#aaa;
    font-style:italic;
    font-weight:bold;
}

/* Teams */

.team{
    background:#222;
    border-left:8px solid #ff7b00;
    border-radius:10px;
    padding:22px;
    margin-bottom:20px;
    transition:.2s;
}

.team:hover{
    transform:translateY(-3px);
    background:#2a2a2a;
    box-shadow:0 6px 18px rgba(0,0,0,.4);
}

.team h2{
    color:#ff7b00;
    margin-bottom:14px;
}

.roster{
    list-style:none;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));
    gap:10px;
}

.roster li{
    background:#1a1a1a;
    border-radius:6px;
    padding:10px 14px;
    font-size:17px;
}

footer{
    text-align:center;
    padding:30px;
    color:#777;
}


/* Mobile Support */

@media(max-width:700px){

    .hamburger{
        top:14px;
        right:14px;
        padding:12px 14px;
    }

    .nav-links{
        width:75vw;
        right:-80vw;
        padding-top:90px;
    }

    nav a{
        font-size:19px;
    }

    .page{
        padding:20px;
    }

    .hero{
        min-height:80vh;
        padding:20px;
    }

    .games-page,
    .teams-page,
    .playoffs-page{
        min-height:80vh;
        padding:20px;
    }

    .hero h1{
        font-size:42px;
    }

    .hero p{
        font-size:22px;
    }

    .button{
        font-size:20px;
        padding:15px 30px;
    }

    .games-title,
    .teams-title,
    .playoffs-title{
        font-size:36px;
    }

    .game,
    .team{
        padding:18px;
    }

    .roster{
        grid-template-columns:repeat(auto-fill, minmax(130px, 1fr));
    }

}

</style>
</head>

<script>

function toggleMenu(){

document.getElementById("navLinks").classList.toggle("open");
document.getElementById("hamburgerBtn").classList.toggle("active");
document.getElementById("navOverlay").classList.toggle("open");

}

function closeMenu(){

document.getElementById("navLinks").classList.remove("open");
document.getElementById("hamburgerBtn").classList.remove("active");
document.getElementById("navOverlay").classList.remove("open");

}

function showPage(page){

document.querySelectorAll(".page").forEach(function(p){
    p.classList.remove("active");
});

document.getElementById(page).classList.add("active");

window.scrollTo({
    top:0,
    behavior:"smooth"
});

}

</script>
