<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WMS Basketball</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

html{
    scroll-behavior:smooth;
}

@media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}

body{
    background:#111;
    color:white;
}

/* Navigation */

nav{
    position:sticky;
    top:0;
    z-index:1000;
    background:#ff7b00;
    display:flex;
    justify-content:center;
    gap:50px;
    padding:18px;
    box-shadow:0 2px 10px rgba(0,0,0,.4);
}

nav a{
    position:relative;
    color:white;
    text-decoration:none;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
    padding-bottom:4px;
}

nav a::after{
    content:"";
    position:absolute;
    left:0;
    bottom:-2px;
    width:0%;
    height:2px;
    background:black;
    transition:.25s ease;
}

nav a:hover{
    color:black;
}

nav a:hover::after{
    width:100%;
}

/* Pages */

.page{
    display:none;
    min-height:calc(100vh - 70px);
    padding:40px;
}

.page.active{
    display:block;
    animation:fadeIn .4s ease;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(8px);}
    to{opacity:1; transform:translateY(0);}
}

/* Home */

.hero{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    min-height:75vh;

    background:
    linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.65)),
    url("backround.jpg");

    background-size:cover;
    background-position:center;
    border-radius:15px;
}

.hero h1{
    font-size:72px;
    color:#ff7b00;
    font-weight:900;
    margin-bottom:20px;
    text-shadow:0 4px 20px rgba(0,0,0,.5);
}

.hero p{
    font-size:28px;
    color:#ddd;
}

.button{
    margin-top:45px;
    background:#ff7b00;
    color:white;
    padding:18px 42px;
    border-radius:10px;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
    box-shadow:0 4px 14px rgba(255,123,0,.25);
}

.button:hover{
    background:white;
    color:black;
    transform:translateY(-3px);
    box-shadow:0 8px 20px rgba(255,123,0,.35);
}


/* Games Background */

.games-page{
    min-height:75vh;

    background:
    linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.65)),
    url("courts.jpg");

    background-size:cover;
    background-position:center;
    border-radius:15px;
    padding:40px;
}


/* Games */

.games-container{
    max-width:1000px;
    margin:auto;
}

.games-title{
    text-align:center;
    color:#ff7b00;
    font-size:48px;
    margin-bottom:35px;
    text-shadow:0 4px 20px rgba(0,0,0,.5);
}

.no-games{
    text-align:center;
    color:#aaa;
    font-style:italic;
    font-size:24px;
    margin-top:50px;
}

.game{
    background:#222;
    border-left:8px solid #ff7b00;
    border-radius:10px;
    padding:22px;
    margin-bottom:20px;
    transition:.2s;
}

.game:hover{
    transform:translateY(-3px);
    background:#2a2a2a;
    box-shadow:0 6px 18px rgba(0,0,0,.4);
}

.game h2{
    color:#ff7b00;
    margin-bottom:10px;
}

.game p{
    margin:7px 0;
    font-size:18px;
}

.watch{
    margin-top:15px;
}

.watch a{
    display:inline-block;
    background:#ff7b00;
    color:white;
    text-decoration:none;
    padding:10px 18px;
    border-radius:6px;
    font-weight:bold;
    transition:.2s;
}

.watch a:hover{
    background:white;
    color:black;
}

.not-uploaded{
    color:#aaa;
    font-style:italic;
    font-weight:bold;
}

footer{
    text-align:center;
    padding:30px;
    color:#777;
}


/* Mobile Support */

@media(max-width:700px){

    nav{
        gap:25px;
        padding:15px;
    }

    nav a{
        font-size:17px;
    }

    .page{
        padding:20px;
    }

    .hero{
        min-height:80vh;
        padding:20px;
    }

    .games-page{
        min-height:80vh;
        padding:20px;
    }

    .hero h1{
        font-size:42px;
    }

    .hero p{
        font-size:22px;
    }

    .button{
        font-size:20px;
        padding:15px 30px;
    }

    .games-title{
        font-size:36px;
    }

    .game{
        padding:18px;
    }

}

</style>
</head>

<body>

<nav>
    <a onclick="showPage('home')">HOME</a>
    <a onclick="showPage('games')">GAMES</a>
</nav>


<!-- HOME PAGE -->

<div class="page active" id="home">

<div class="hero">

<h1>WMS Basketball</h1>

<p>Check back soon.</p>

<div class="button" onclick="showPage('games')">
View Games
</div>

</div>

</div>


<!-- GAMES PAGE -->

<div class="page" id="games">

<div class="games-page">

<div class="games-container">

<h1 class="games-title">Games</h1>

<div style="margin-top:25px; text-align:center;">
    <a href="https://www.youtube.com/playlist?list=PLhl7YhPgeXATZWUfdYo-5q3F0ibUts-ku"
       target="_blank"
       style="
            color:#ff7b00;
            font-size:22px;
            font-weight:bold;
            text-decoration:none;
            transition:.2s;
       ">
        Watch Some of Last Year's Games →
    </a>
</div>

<p class="no-games">Nothing here yet!</p>

<!----------------------------------------------------------------------- <-- add a > here to add a game
<div class="game">

<h2>January 67, 1967</h2>

<p><strong>Teams:</strong> Test vs Test</p>

<p><strong>Score:</strong> 48 - 100</p>

<div class="watch">
<a href="https://youtube.com/" target="_blank">
▶ Watch Game
</a>
</div>

</div>
<!----------------------------------------------------------------------->

</div>

</div>

</div>


<footer>
© 2026 WMS Basketball
</footer>


<script>

function showPage(page){

document.querySelectorAll(".page").forEach(function(p){
    p.classList.remove("active");
});

document.getElementById(page).classList.add("active");

window.scrollTo({
    top:0,
    behavior:"smooth"
});

}

</script>

</body>
</html>
